<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="/favicon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<title>Sistema Alra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: tema claro único (decisão de marca: clean, sem modo escuro); menu lateral branco + área off-white; magenta só em ação, seleção e alerta */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --canvas:#FBFAFC; --surface:#F5F3F6; --raised:#FFFFFF; --line:#EEEAF0; --line2:#E0DAE4;
  --fg:#241C29; --muted:#726B78; --faint:#A29BA8;
  --accent:#FF0092; --accent-ink:#FFFFFF; --accent-soft:#FFF0F8; --accent-fg:#C80077;
  --ok:#0F7A55; --ok-soft:#DDF3E7; --apv:#0E6E78; --apv-soft:#E2F3F5; --warn:#9A5300; --warn-soft:#FFF2E0;
  --info:#3150B8; --info-soft:#EDF1FD; --plan:#6747B5; --plan-soft:#F1EDFB; --done:#5E5764; --done-soft:#F0EDF1;
  --danger:#C2283A; --danger-soft:#FDEBED;
  --s-pauta:#7E62C9; --s-producao:#A39BA9; --s-revisao:#4A68CF; --s-cliente:#FF0092; --s-ajuste:#D98200; --s-aprovado:#1A93A0; --s-publicado:#13996A;
  --shadow:0 1px 2px rgba(36,28,41,.04),0 6px 20px rgba(36,28,41,.05); --shadow-lg:0 24px 60px rgba(36,28,41,.16); --scrim:rgba(36,28,41,.32);
  --f:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--canvas);color:var(--fg);font-family:var(--f);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-weight:800;font-size:clamp(21px,2.4vw,26px);letter-spacing:-.02em;line-height:1.2}
h1 em{font-style:normal;color:var(--accent)}
h2{font-weight:700;font-size:16px;letter-spacing:-.01em}
h3{font-weight:700;font-size:14px}
p{margin:0}

/* shell */
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100%}
@media (max-width:880px){.shell{grid-template-columns:minmax(0,1fr)}}
.side{background:var(--bg);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
@media (max-width:880px){.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;gap:10px}}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px;min-width:0}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.brand b{font-weight:800;font-size:15px;display:block;line-height:1.2}
.brand span{display:block;font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bell{position:relative;border:1px solid var(--line);background:var(--bg);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;flex:none;color:var(--muted)}
.bell:hover{color:var(--fg);border-color:var(--line2)}
.bell svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bell i{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:99px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;font-style:normal;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-weight:700;font-size:12.5px;width:100%}
.navl{display:flex;flex-direction:column;gap:1px}
@media (max-width:880px){.navl{flex-direction:row;overflow-x:auto;max-width:100%}}
.navl button{border:0;background:none;color:var(--muted);text-align:left;padding:8px 10px;border-radius:9px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.navl button:hover{background:var(--surface);color:var(--fg)}
.navl button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-fg)}
.navl .ncnt{margin-left:auto;background:var(--accent);color:#fff;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:99px;font-variant-numeric:tabular-nums}
.navsec{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:10px 10px 4px}
@media (max-width:880px){.navsec{display:none}}
.ico{width:18px;height:18px;flex:none;display:inline-grid;place-items:center}
.ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mebox{margin-top:auto;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--canvas)}
.mebtn{display:flex;align-items:center;gap:9px;border:0;background:none;padding:0;text-align:left;min-width:0}
.mebtn b{display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mebtn span{color:var(--muted);font-size:11px;display:block}
.mebox label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.mebox select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;font-size:12.5px;font-weight:700}
.main{padding:28px 16px 80px;display:flex;flex-direction:column;gap:20px;min-width:0;max-width:1640px;width:100%}
@media (min-width:760px){.main{padding-inline:36px}}

/* base */
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;flex:none;object-fit:cover;overflow:hidden}
.avs{display:inline-flex}.avs .av{border:2px solid var(--raised);margin-left:-6px}.avs .av:first-child{margin-left:0}
.btn{border:1px solid var(--line2);background:var(--raised);border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;color:var(--fg);text-decoration:none}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.linkbtn{border:0;background:none;padding:2px 4px;color:var(--accent-fg);font-size:12.5px;font-weight:700;border-radius:6px;text-decoration:none}
.linkbtn:hover{text-decoration:underline}
.chip{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip:hover{border-color:var(--line2);color:var(--fg)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-fg);background:var(--accent-soft)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.spread{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.card{border:1px solid var(--line);border-radius:14px;background:var(--raised);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
@media (max-width:400px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-plan{background:var(--plan-soft);color:var(--plan)} .t-info{background:var(--info-soft);color:var(--info)}
.t-warn{background:var(--warn-soft);color:var(--warn)} .t-accent{background:var(--accent-soft);color:var(--accent-fg)}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-apv{background:var(--apv-soft);color:var(--apv)} .t-done{background:var(--done-soft);color:var(--done)}
.t-prod{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.t-bad{background:var(--danger-soft);color:var(--danger)}
.flag{font-size:11px;font-weight:700;color:var(--danger)} .flag.soon{color:var(--warn)}
.netb{display:inline-flex;align-items:center;font-size:10px;font-weight:800;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:var(--surface);color:var(--fg);white-space:nowrap}
.empty{border:1.5px dashed var(--line2);border-radius:14px;padding:28px 22px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;background:var(--raised)}
.empty p{max-width:62ch;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--raised);display:flex;flex-direction:column;gap:2px;text-align:left;box-shadow:var(--shadow)}
button.kpi:hover{border-color:var(--line2)}
.kpi b{font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.kpi small{font-size:11.5px;color:var(--muted)}
.kpi.hot b{color:var(--accent)} .kpi.bad b{color:var(--danger)} .kpi.good b{color:var(--ok)}
.tbw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--raised);box-shadow:var(--shadow)}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tb tr:last-child td{border-bottom:0}
.tb .num{font-variant-numeric:tabular-nums;text-align:right}
.cli{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:12.5px;min-width:0}
.cli span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{background:var(--surface);border-radius:10px;padding:10px 12px;font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px 12px;font-size:12.5px;font-weight:700}
.warnbox{background:var(--warn-soft);border-left:3px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.badbox{background:var(--danger-soft);border-left:3px solid var(--danger);border-radius:10px;padding:10px 12px;font-size:12.5px}
.monthctl{display:flex;align-items:center;gap:6px}
.monthctl b{min-width:140px;text-align:center;font-weight:700;font-size:14px}
.sq{border:1px solid var(--line2);background:var(--raised);border-radius:9px;width:32px;height:32px;display:grid;place-items:center;font-size:17px;line-height:1;flex:none}

/* setup */
.center{min-height:100%;display:grid;place-items:center;padding:40px 16px}
.wiz{width:min(780px,100%);display:flex;flex-direction:column;gap:20px}
.wsteps{display:flex;gap:8px;flex-wrap:wrap}
.wsteps span{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--faint)}
.wsteps span i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;border:1.5px solid var(--line2)}
.wsteps span.on{color:var(--fg)} .wsteps span.on i{background:var(--accent);border-color:var(--accent);color:#fff}
.wsteps span.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.wsteps .sep{width:24px;height:1.5px;background:var(--line2);align-self:center}
.prow{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr) minmax(0,2fr) 30px;gap:8px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--raised)}
@media (max-width:640px){.prow{grid-template-columns:minmax(0,1fr)}}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.person{border:1px solid var(--line);background:var(--raised);border-radius:12px;padding:12px;display:flex;align-items:center;gap:12px;text-align:left;box-shadow:var(--shadow)}
.person:hover{border-color:var(--accent)}
.person b{display:block;font-size:13.5px}.person span{font-size:12px;color:var(--muted)}

/* checklist */
.steps-list{display:flex;flex-direction:column}
.stp{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.stp:first-child{border-top:0}
.stp .ck{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--faint)}
.stp.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.stp.next .ck{border-color:var(--accent);color:var(--accent-fg)}
.stp b{font-size:13.5px}.stp.done b{color:var(--muted)}
.stp p{font-size:12.5px;color:var(--muted)}
.progress{height:6px;border-radius:99px;background:var(--surface);overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* media */
.media{width:100%;height:100%;object-fit:cover;display:block;background:#EDEAEF}
.phc{width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:9%;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 18%,#fff),color-mix(in srgb,var(--c) 40%,#fff));color:color-mix(in srgb,var(--c) 70%,#241C29);font-weight:800;font-size:12px;line-height:1.2;text-align:left;container-type:inline-size}
.phc b{font-size:clamp(9px,9cqw,22px)}
.phc small{font-weight:700;font-size:clamp(8px,4.5cqw,12px);opacity:.75;margin-top:4px}

/* calendar */
.cal{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--raised);box-shadow:var(--shadow)}
.cal-h,.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-h div{padding:8px 10px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.day{min-height:116px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}
.day:nth-child(7n){border-right:0}
.day.out{background:var(--canvas)} .day.out .dn{opacity:.45}
.day.today .dn{background:var(--accent);color:#fff}
.day.dropover{background:var(--accent-soft)}
.dn{font-size:12px;font-weight:700;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.add{position:absolute;top:6px;right:6px;border:0;background:none;color:var(--muted);font-size:16px;line-height:1;width:24px;height:24px;border-radius:6px;opacity:0}
.day:hover .add,.add:focus-visible{opacity:1}
@media (hover:none){.add{opacity:1}}
.add:hover{background:var(--surface);color:var(--accent-fg)}
.ev{border:0;text-align:left;border-radius:6px;padding:3px 6px;font-size:11px;line-height:1.25;display:flex;align-items:center;gap:5px;min-width:0;width:100%}
.ev .k{font-weight:800;font-size:9.5px;letter-spacing:.04em;flex:none}
.ev .h{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ev[draggable="true"]{cursor:grab}
.ev.t-ok{background:#C9EEDA;color:#0B6346}
.more{font-size:11px;font-weight:700;color:var(--muted);padding-left:4px;border:0;background:none;text-align:left}
.agenda{display:none}
@media (max-width:760px){.cal{display:none}.agenda{display:flex;flex-direction:column;gap:12px}}
.ag-day{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px}
.ag-d{text-align:center;padding-top:4px}.ag-d b{display:block;font-size:19px;font-weight:800;line-height:1}
.ag-d span{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ag-list{display:flex;flex-direction:column;gap:5px;min-width:0}.ag-list .ev{padding:8px 10px;font-size:12.5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.banner{border:1px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}

/* kanban */
.board{display:grid;grid-template-columns:repeat(7,minmax(138px,1fr));gap:7px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--surface);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:160px;border:2px solid transparent}
.col.dropover{border-color:var(--accent);background:var(--accent-soft)}
.col-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px 4px}
.col-h b{font-size:12.5px;display:flex;align-items:center;gap:7px}.col-h span{font-size:11.5px;font-weight:800;color:var(--muted)}
.kc{border:1px solid var(--line);background:var(--raised);border-radius:12px;padding:7px;text-align:left;display:grid;grid-template-columns:30px minmax(0,1fr);gap:7px;align-items:start;cursor:grab}
.kc:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.kc.mine{box-shadow:inset 3px 0 0 var(--accent)}
.kc.dragging{opacity:.4}
.kc .th,.li .th{aspect-ratio:4/5;border-radius:6px;overflow:hidden;background:var(--surface)}
.kc .th{width:30px}
.kc .t{font-size:12px}
.kc .m{gap:2px 8px;font-size:11px}
.kc .t,.li .t{font-weight:700;font-size:12.5px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.kc .m,.li .m{font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:3px}
.list{display:flex;flex-direction:column;gap:8px}
.li{border:1px solid var(--line);background:var(--raised);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%}
.li:hover{border-color:var(--line2)}
.li .th{width:44px}
@media (max-width:520px){.li{grid-template-columns:40px minmax(0,1fr)}.li>:last-child{grid-column:1 / -1}}
.rad{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--raised)}
.rad .top{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.rad .per{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--surface);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.dl{font-size:12px;font-weight:700}.dl.late{color:var(--danger)}.dl.soon{color:var(--warn)}.dl.fine{color:var(--muted);font-weight:600}
.hbar{display:grid;grid-template-columns:150px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:12.5px}
.hbar .tr{height:12px;background:var(--surface);border-radius:4px;overflow:hidden;display:flex;gap:2px}.hbar .tr i{display:block;height:100%}

/* dashboard */
.stack{display:flex;height:26px;border-radius:8px;overflow:hidden;gap:2px;background:var(--surface)}
.stack button{border:0;padding:0;height:100%;min-width:4px;position:relative}
.stack button:hover{filter:brightness(1.08)}
.stack button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--fg)}
.dleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px}
.dleg button{border:0;background:none;padding:2px 0;display:inline-flex;align-items:center;gap:6px;color:var(--fg);font-weight:600}
.dleg button i{width:10px;height:10px;border-radius:3px;display:inline-block}
.dleg b{font-variant-numeric:tabular-nums}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mcal .h{font-size:10px;font-weight:700;color:var(--faint);text-align:center;text-transform:uppercase}
.mc{border:1px solid var(--line);border-radius:8px;min-height:48px;padding:4px 5px;display:flex;flex-direction:column;gap:3px;background:var(--raised);text-align:left}
button.mc:hover{border-color:var(--line2)}
.mc.today{border-color:var(--accent)}
.mc.blank{border:0;background:none}
.mc .n{font-size:10.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.mc .ds{display:flex;flex-wrap:wrap;gap:3px}
.mc .ds i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* clientes */
.ccard{border:1px solid var(--line);border-radius:14px;background:var(--raised);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;text-align:left;box-shadow:var(--shadow)}
button.ccard:hover{border-color:var(--line2)}
.ccard h3{font-size:15px;font-weight:800;display:flex;align-items:center;gap:9px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:12.5px;margin:0}
.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:700;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.mat{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--raised);display:flex;flex-direction:column;color:inherit;text-decoration:none}
.mat .mt{aspect-ratio:16/10;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.mat .mi{padding:9px 11px;display:flex;flex-direction:column;gap:3px;font-size:12px}.mat .mi b{font-size:13px}
.vault{display:flex;flex-direction:column;gap:8px}
.vrow{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr) 340px;gap:12px;align-items:center;background:var(--raised)}
.vrow>:last-child{justify-content:flex-end}
@media (max-width:760px){.vrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.vrow>:last-child{grid-column:1 / -1;flex-wrap:wrap!important}}
.vrow .lb{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.vrow .val{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;overflow-wrap:anywhere}
.secret{letter-spacing:.2em;color:var(--faint)}

/* escopo (formulário do cliente) */
.netpick{display:flex;flex-wrap:wrap;gap:8px}
.netpick label{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line2);border-radius:12px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;background:var(--raised)}
.netpick input{accent-color:var(--accent)}
.netpick label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent-fg)}
.npanel{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--canvas)}
.npanel>b{font-size:13px}
.fmtrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) minmax(0,1.2fr);gap:10px;align-items:center;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
@media (max-width:680px){.fmtrow{grid-template-columns:minmax(0,1fr)}}
.fmtrow.off{opacity:.55}
.fmtrow .tg{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px}
.fmtrow .tg input{accent-color:var(--accent);width:16px;height:16px}
.wd{display:flex;gap:3px;flex-wrap:wrap}
.wd label{width:28px;height:28px;border:1px solid var(--line2);border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700;cursor:pointer;position:relative;background:var(--raised)}
.wd input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.wd label:has(input:checked){background:var(--accent);border-color:var(--accent);color:#fff}
.wd label:has(input:disabled){cursor:default}

/* overlay */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade .15s}
@keyframes fade{from{opacity:.3}}
@keyframes slide{from{transform:translateX(28px);opacity:.6}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1120px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:slide .18s ease-out;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.d-top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex:none;min-width:0}
.d-top .ttl{flex:1;min-width:0}
.d-top .ttl b{display:block;font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d-top .ttl span{font-size:12px;color:var(--muted)}
.x{border:1px solid var(--line2);background:var(--raised);border-radius:9px;width:34px;height:34px;display:grid;place-items:center;font-size:18px;line-height:1;flex:none}
.d-body{flex:1;overflow:auto;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}
@media (max-width:880px){.d-body{grid-template-columns:minmax(0,1fr)}}
.viewer{background:var(--canvas);padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px;position:sticky;top:0;min-width:0;border-right:1px solid var(--line)}
@media (max-width:880px){.viewer{position:static;border-right:0}}
.stagebox{position:relative;width:100%;max-width:380px}
.frame{width:100%;border-radius:10px;overflow:hidden;max-width:100%;background:var(--surface)}
.frame .media{object-fit:contain;background:#111}
.frame.blank{display:grid;place-items:center;border:1.5px dashed var(--line2);background:var(--raised);color:var(--muted);font-size:12.5px;padding:20px;text-align:center}
.navb{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.95);color:#241C29;font-size:18px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:2}
.navb.p{left:8px}.navb.n{right:8px}
.strip{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding-bottom:4px}
.strip .sb{flex:none;width:52px;position:relative}
.strip .sb button.t{width:52px;aspect-ratio:4/5;border-radius:6px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--surface);display:block}
.strip .sb button.t[aria-current="true"]{border-color:var(--accent)}
.strip .sb .ops{display:flex;justify-content:space-between;margin-top:2px}
.strip .sb .ops button{border:0;background:none;font-size:12px;padding:0 3px;color:var(--muted)}
.strip .sb .ops button:hover{color:var(--fg)}
.spec{font-size:11.5px;color:var(--muted);text-align:center}
.detail{padding:16px 20px 44px;display:flex;flex-direction:column;gap:18px;min-width:0}
.sec h3{margin:0 0 8px;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stepbar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.stepbar div{height:5px;border-radius:99px;background:var(--line)}
.stepbar div.on{background:var(--accent)} .stepbar div.past{background:color-mix(in srgb,var(--accent) 30%,var(--line))}
.stepl{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.stepl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stepl span.on{color:var(--accent-fg)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
@media (max-width:560px){.form{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1 / -1}
.field>label,.field>.lb{font-size:12px;font-weight:700}
.hint{font-size:11.5px;color:var(--muted);font-weight:500}
textarea,.inp{width:100%;border:1px solid var(--line2);border-radius:10px;padding:8px 11px;background:var(--raised);line-height:1.5}
textarea{resize:vertical}
textarea:focus,.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea:disabled,.inp:disabled{background:var(--surface);opacity:1;border-color:transparent;color:var(--fg)}
.cap-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted)}
.over{color:var(--danger);font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;background:var(--raised)}
.seg input{accent-color:var(--accent)}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent-fg)}
.seg label:has(input:disabled){cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px}.actions .btn{flex:1 1 160px}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--raised)}
.upl{border:1.5px dashed var(--line2);border-radius:12px;padding:14px;text-align:center;background:var(--canvas);cursor:pointer;display:block;font-size:12.5px}
.upl:hover{border-color:var(--accent)}
.upl b{color:var(--accent-fg)}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:12px minmax(0,1fr);gap:10px;padding-bottom:11px;position:relative}
.hist li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--line2);margin-top:5px}
.hist li:not(:last-child)::after{content:"";position:absolute;left:4px;top:16px;bottom:0;width:1px;background:var(--line)}
.hist li.hl::before{background:var(--accent)}
.hist .a{font-weight:700;font-size:12.5px}.hist .s{font-size:11.5px;color:var(--muted)}
.hist .q{font-size:12.5px;margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere}
.cm{display:grid;grid-template-columns:26px minmax(0,1fr);gap:9px}
.cm .b{background:var(--surface);border-radius:10px;padding:8px 10px;font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.cm .s{font-size:11px;color:var(--muted);margin-bottom:2px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,calc(100% - 24px));max-height:calc(100% - 32px);overflow:auto;background:var(--bg);border-radius:16px;z-index:41;box-shadow:var(--shadow-lg);animation:fade .15s}
.modal.wide{width:min(900px,calc(100% - 24px))}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}
.m-body{padding:16px 20px 22px;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bg);color:var(--fg);border:1px solid var(--line2);border-left:4px solid var(--accent);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;z-index:70;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px)}
.err{color:var(--danger);font-size:12.5px;font-weight:600}
.syncdot{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:600}
.syncdot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.syncdot.local::before{background:var(--warn)}
.nlist{display:flex;flex-direction:column;gap:2px}
.nitem{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;padding:10px 8px;border:0;border-top:1px solid var(--line);text-align:left;background:none;width:100%;align-items:start}
.nitem:first-child{border-top:0}
.nitem.unread{background:var(--accent-soft);border-radius:10px;border-top-color:transparent}
.nitem b{font-size:12.5px}.nitem p{font-size:12.5px}.nitem small{font-size:11px;color:var(--muted);white-space:nowrap}

/* portal + mockups */
.ptop{background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pwrap{max-width:980px;margin:0 auto;padding:24px 16px 80px;display:flex;flex-direction:column;gap:18px}
.big{font-weight:800;font-size:clamp(24px,3.5vw,32px);letter-spacing:-.025em;line-height:1.1}
.summary{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--raised);box-shadow:var(--shadow)}
.summary .nums{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:13px}
.summary .nums b{font-size:18px;font-weight:800;margin-right:4px}
.ntabs{display:flex;gap:6px;flex-wrap:wrap}
.ntabs button{border:1px solid var(--line2);background:var(--raised);border-radius:999px;padding:7px 14px;font-weight:700;font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.ntabs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-fg)}
.igprof{background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden;max-width:620px;width:100%;margin:0 auto}
.ighead{display:grid;grid-template-columns:76px minmax(0,1fr);gap:18px;align-items:center;padding:18px 18px 12px}
.igava{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#EDE8F0,#DCD5E1);box-shadow:0 0 0 2px var(--bg),0 0 0 4px #E7E1EB}
.igstats{display:flex;gap:22px}
.igstats div{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.sk{display:block;height:9px;border-radius:99px;background:#ECE7EF}
.igtabs{display:flex;justify-content:center;gap:56px;border-top:1px solid var(--line);color:var(--faint)}
.igtabs span{padding:10px 0;border-top:1.5px solid transparent;margin-top:-1px;display:inline-flex}
.igtabs span.on{color:var(--fg);border-top-color:var(--fg)}
.igtabs svg,.igic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px}
.igt{position:relative;aspect-ratio:3/4;border:0;padding:0;overflow:hidden;background:var(--surface);display:block}
.igt .ic{position:absolute;top:7px;right:7px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));display:flex}
.igt .ic svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:1.8}
.dt{position:absolute;left:6px;top:6px;background:rgba(255,255,255,.92);color:#241C29;font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;z-index:2}
.stb{position:absolute;left:6px;bottom:6px;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:99px;z-index:2;white-space:nowrap}
.stb.cliente{background:#fff;color:#241C29;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.stb.aprovado{background:var(--s-aprovado);color:#fff}.stb.publicado{background:var(--s-publicado);color:#fff}.stb.ajuste{background:var(--s-ajuste);color:#fff}
.stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.storyt{position:relative;aspect-ratio:9/16;border-radius:12px;overflow:hidden;border:0;padding:0;background:var(--surface)}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.vcard{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px}
.vthumb{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--surface)}
.vthumb.tall{aspect-ratio:9/16;max-width:200px}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:2}
.play::after{content:"";border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.limock{border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;width:100%}
.limock .lh{display:grid;grid-template-columns:42px minmax(0,1fr);gap:10px;padding:12px 14px;align-items:center}
.limock .lh i{width:42px;height:42px;border-radius:50%;background:#E8E3EC;display:block}
.limock .lt{padding:0 14px 10px;font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;max-height:7.5em;overflow:hidden}
.limock .li2{aspect-ratio:1.91/1;background:var(--surface);overflow:hidden}
.limock .li2.sq{aspect-ratio:4/5}
.limock .lf{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:8px;color:var(--muted);font-size:12px;font-weight:700}
.post{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(500px,calc(100% - 20px));max-height:calc(100% - 24px);overflow:auto;background:var(--bg);border-radius:16px;z-index:41;box-shadow:var(--shadow-lg);animation:fade .15s}
.post.wide{width:min(720px,calc(100% - 20px))}
.pclose{position:absolute;right:10px;top:10px;z-index:6;background:rgba(255,255,255,.95);border:1px solid var(--line);width:32px;height:32px;border-radius:50%;font-size:17px}
.igpost .phd{display:flex;align-items:center;gap:10px;padding:10px 48px 10px 12px}
.igpost .phd i{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#EDE8F0,#DCD5E1);display:block;flex:none}
.igmedia{position:relative;background:#111}
.pcnt{position:absolute;right:10px;top:10px;z-index:3;background:rgba(20,10,20,.7);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.igic{display:flex;align-items:center;gap:14px;padding:10px 12px 4px}
.igic .sp{flex:1;display:flex;justify-content:center}
.dots{display:flex;justify-content:center;gap:4px}
.dots button{width:6px;height:6px;border-radius:99px;border:0;background:var(--line2);padding:0}
.dots button[aria-current="true"]{background:var(--info)}
.igcap{padding:4px 12px 12px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.igcap .u{display:inline-block;width:70px;height:9px;border-radius:99px;background:#ECE7EF;margin-right:6px;vertical-align:middle}
.storyv{position:relative;aspect-ratio:9/16;background:#111;max-height:72vh;margin:0 auto}
.storyv .bars{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:3px;z-index:3}
.storyv .bars i{flex:1;height:2.5px;border-radius:99px;background:rgba(255,255,255,.45)}
.storyv .bars i.on{background:#fff}
.storyv .who{position:absolute;left:10px;top:18px;z-index:3;display:flex;align-items:center;gap:8px}
.storyv .who i{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.7);display:block}
.apv{border-top:1px solid var(--line);padding:14px 16px 18px;display:flex;flex-direction:column;gap:10px;background:var(--canvas)}

/* v4: pautas, publicações, cliente, relatórios */
.kc .th.tk,.kc .th.tx{display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--plan);background:var(--plan-soft);aspect-ratio:1}
.kc .th.tx{color:var(--info);background:var(--info-soft);font-size:12px}
.kc.task{border-style:dashed}
.tkb{width:100%;height:100%;display:grid;place-items:center;background:var(--plan-soft);color:var(--plan);font-weight:800}
.plistw{display:flex;flex-direction:column;gap:8px}
.prow2{border:1px solid var(--line);border-radius:14px;background:var(--raised);box-shadow:var(--shadow);overflow:hidden}
.prow2.today{border-color:var(--accent)}
.prow2.late{border-left:4px solid var(--danger)}
.phead{width:100%;border:0;background:none;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;text-align:left}
.phead:hover{background:var(--canvas)}
.pdate{text-align:center}.pdate b{display:block;font-size:20px;font-weight:800;line-height:1}.pdate span{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.pinfo{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px}.pinfo .muted{font-size:12.5px;width:100%}
.pstat{display:flex;align-items:center;gap:10px}
.chev{width:28px;height:28px;border-radius:8px;border:1px solid var(--line2);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.plist{display:flex;flex-direction:column;gap:6px;padding:0 14px 12px 78px}
.plist.done .li{opacity:.75}
@media (max-width:620px){.plist{padding-left:14px}}
.sw{width:18px;height:18px;border-radius:5px;border:1px solid var(--line2);display:inline-block;flex:none}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.corrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.2fr) 30px;gap:8px;align-items:center}
.corrow input[type=color]{width:36px;height:36px;border:1px solid var(--line2);border-radius:8px;padding:2px;background:var(--raised);flex:none}
@media (max-width:760px){.corrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.scopebar{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--raised)}
.scopebar .eyebrow{margin-right:4px}
.sc{font-size:12px;background:var(--surface);border-radius:99px;padding:3px 10px;color:var(--muted)}.sc b{color:var(--fg)}
.ori{gap:6px}.oritxt{white-space:pre-wrap;font-size:13.5px;line-height:1.6}
.dfiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.dfile{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-decoration:none;color:inherit;min-width:0}
.dfile:hover{border-color:var(--line2)}.dfile b{display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dfile small{color:var(--muted);font-size:11px}
.dic{font-size:18px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round}
.rel{gap:14px}
.relh{border:0;background:none;padding:0;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%}
.relh b{display:block;font-size:15px;font-weight:800;margin-top:2px}
.rkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.rsec{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--canvas)}
.rsec h3{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.rsec ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.rsec li{font-size:13px;padding-left:12px;position:relative}
.rsec li::before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--line2)}
.rsec li.al::before{background:var(--danger)}.rsec li.ok::before{background:var(--ok)}
.rsec li small{display:block;color:var(--muted);font-size:11.5px}
.sysav{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center}
.spons{position:absolute;right:6px;bottom:6px;background:rgba(255,255,255,.92);color:#241C29;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:5px;z-index:2}
.adcta{display:flex;justify-content:space-between;padding:10px 12px;background:var(--info-soft);color:var(--info);font-weight:700;font-size:13px}
.doccard{border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.doccard:hover{border-color:var(--line2)}
.doccard .dimg{aspect-ratio:1.91/1;background:var(--surface);overflow:hidden;display:block}
.dbody{display:flex;flex-direction:column;gap:6px;padding:14px 16px;align-items:flex-start}
.dbody b{font-size:16px;line-height:1.3}.dex{font-size:12.5px;color:var(--muted);line-height:1.5}
.post.doc{width:min(760px,calc(100% - 20px))}
.docw{padding:28px clamp(18px,5vw,48px) 22px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.docimg{position:relative;width:100%;border-radius:12px;overflow:hidden;background:var(--surface)}
.docimg .media{object-fit:contain;max-height:420px;background:var(--surface)}
.doch{font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.2}
.docsub{font-size:16px;color:var(--muted);font-weight:600;line-height:1.45}
.doctxt{white-space:pre-wrap;font-size:15px;line-height:1.75;max-width:66ch}
.d-body.one{grid-template-columns:minmax(0,760px);justify-content:center}
.txtv{align-items:stretch}
.txted{display:flex;flex-direction:column;gap:12px;width:100%}
.txted textarea{min-height:360px;font-size:14px;line-height:1.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function migrate(){

          if (redes.includes("Instagram") || redes.includes("Facebook")) { e.meta.instagram = e.meta.instagram || redes.includes("Instagram"); e.meta.facebook = e.meta.facebook || redes.includes("Facebook"); e.meta.feed = Object.assign({}, f); }
          if (redes.includes("LinkedIn")) { e.linkedin.on = true; e.linkedin.post = Object.assign({}, f); }
          if (redes.includes("TikTok")) { e.tiktok.on = true; e.tiktok.video = Object.assign({}, f); }
          if (redes.includes("YouTube")) { e.youtube.on = true; e.youtube.video = Object.assign({}, f); }
        } else if (r.tipo === "stories") { e.meta.instagram = true; e.meta.stories = f; }
        else if (r.tipo === "shorts") { e.youtube.on = true; e.youtube.shorts = f; }
        else if (r.tipo === "artigo") { e.linkedin.on = true; e.linkedin.artigo = f; }
        else if (r.tipo === "newsletter") { e.linkedin.on = true; e.linkedin.newsletter = f; }
      });
      c.escopo = e; dirty = true;
    } else if (c.escopo && !c.escopo.captacao) { c.escopo = fillEscopo(c.escopo); dirty = true; }
    if (!c.escopo) { c.escopo = blankEscopo(); dirty = true; }

  });

    p.v3 = true; dirty = true;
  });

const b64e = buf => { let s = ""; new Uint8Array(buf).forEach(b => s += String.fromCharCode(b)); return btoa(s); };
const b64d = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
async function deriveKey(pass, salt){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64d(salt), iterations:150000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function encStr(key, text){ const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(text)); return b64e(iv) + "." + b64e(ct); }
async function decStr(key, s){ const [iv, ct] = String(s).split("."); const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(iv)}, key, b64d(ct)); return new TextDecoder().decode(pt); }

// Acessos antigos (cifrados pelo cofre) só abrem se o cofre estiver desbloqueado; os novos ficam em texto e ocultos na tela
async function accPlain(x){
  const isEnc = v => /^[A-Za-z0-9+/=]{16}\.[A-Za-z0-9+/=]+$/.test(String(v || ""));
  if (x.enc !== false && isEnc(x.login) && isEnc(x.senha)) { if (!ui.vaultKey) return {login:"(cadastrado no cofre antigo, atualize)", senha:"(atualize este acesso)"}; try { return {login: await decStr(ui.vaultKey, x.login), senha: await decStr(ui.vaultKey, x.senha)}; } catch(e) { return {login:"(atualize este acesso)", senha:""}; } }
  return {login:x.login || "", senha:x.senha || ""};
}

  if (id === "pfForm") { const x = ui.tmp.pd; x.nome = String(x.nome).trim(); x.email = String(x.email || "").trim().toLowerCase(); if (!x.nome) { ui.tmp.err = "Dê um nome."; fillOverlay(); return; } if (x.email && !/^[^@\s]+@alramarketing\.com\.br$/.test(x.email) && x.email !== (person(x.id) || {}).email) { ui.tmp.err = "Use um e-mail @alramarketing.com.br."; fillOverlay(); return; } if (!isDirReal() && x.email !== String((person(x.id) || {}).email || "").toLowerCase()) { ui.tmp.err = "Só a Diretoria altera e-mails de acesso."; fillOverlay(); return; } if (x.email && S.pessoas.some(y => y.id !== x.id && emailOf(y) === x.email)) { ui.tmp.err = "Este e-mail já está em outra pessoa."; fillOverlay(); return; } if (!(x.papeis || []).length) { ui.tmp.err = "Marque ao menos um papel."; fillOverlay(); return; }

    if (body.resp) notify([body.resp], `${isNew ? "Captação agendada" : "Captação atualizada"}: ${cli(body.clienteId).nome}, ${fmtD(body.data)} às ${body.inicio}`, null, body.clienteId);
    save(); ui.modal = null; ui.tmp = {}; ui.capMonth = firstOfMonth(pd(body.data)); toast("Captação salva"); render(); return; }
  if (id === "matForm") { const n = $("#mt-n").value.trim(); if (!n) { toast("Dê um nome ao material."); return; } S.materiais.push({id:uid(), clienteId:ui.hubId, nome:n, categoria:$("#mt-c").value, origem:$("#mt-o").value, link:$("#mt-l").value.trim(), em:nowIso()}); save(); ui.modal = null; toast("Material adicionado"); render(); return; }
  if (id === "vsForm") { const a = $("#vp1").value, b = $("#vp2").value; if (a.length < 8) { ui.tmp.err = "Use ao menos 8 caracteres."; fillOverlay(); return; } if (a !== b) { ui.tmp.err = "As senhas não conferem."; fillOverlay(); return; }
    const salt = b64e(crypto.getRandomValues(new Uint8Array(16))), key = await deriveKey(a, salt); S.cfg.vault = {salt, check: await encStr(key, "alra-cofre-ok"), criadoEm:nowIso(), por:ui.me}; ui.vaultKey = key; save(); ui.modal = null; ui.tmp = {}; toast("Cofre criado e desbloqueado"); render(); return; }
  if (id === "vuForm") { const a = $("#vp1").value; try { const key = await deriveKey(a, S.cfg.vault.salt); if (await decStr(key, S.cfg.vault.check) !== "alra-cofre-ok") throw 0; ui.vaultKey = key; ui.modal = null; ui.tmp = {}; toast("Cofre desbloqueado"); render(); } catch(e) { ui.tmp.err = "Senha do cofre incorreta."; fillOverlay(); } return; }

      if (x.rede !== rede) x.hist.push({acao:"rede", em:nowIso(), por:ui.me}); if (oldL !== login) x.hist.push({acao:"login", em:nowIso(), por:ui.me}); if (oldS !== senha) x.hist.push({acao:"senha", em:nowIso(), por:ui.me});

    S.feedbacks.push({id:uid(), clienteId:c.id, k, periodo:periodLabel(c, k), decisao:dec, texto:txt, em:nowIso()});

    else notify(((c.squad || {}).planejamento || []), `${c.nome} comentou o planejamento: ${txt.slice(0, 80)}`, null, c.id);
    save(); ui.modal = null; ui.tmp = {}; toast(dec === "total" ? `${pend.length} peças aprovadas. Obrigado!` : "Comentário enviado para a equipe"); render();
  }

document.addEventListener("keydown", ev => {

});

let dragId = null;
const clearDrop = () => document.querySelectorAll(".dropover,.dragging").forEach(x => x.classList.remove("dropover", "dragging"));

document.addEventListener("dragend", () => { window.__dragEnd = Date.now(); dragId = null; clearDrop(); });

document.addEventListener("drop", ev => {
  const d = ev.target.closest && ev.target.closest(".day[data-day],.col[data-col]"); if (!d) return;
  ev.preventDefault(); clearDrop();
  let pid = dragId; try { pid = ev.dataTransfer.getData("text/plain") || dragId; } catch(e) {}
  const p = S.pecas.find(x => x.id === pid); if (!p) return;

});
